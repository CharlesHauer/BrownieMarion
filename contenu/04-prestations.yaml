# ============================================================
#  PAGE PRESTATIONS (et aperçu sur la page Accueil)
# ============================================================
#  - Chaque prestation commence par « - titre: »
#  - Pour en ajouter une : copiez un bloc entier (de « - titre: »
#    jusqu'à la ligne avant le suivant) et collez-le à la fin.
#  - Icônes possibles : voir la liste dans 00-LISEZ-MOI.md

surtitre: Prestations
titre: Un accompagnement sur mesure
intro: >-
  À domicile sur Nantes et sa périphérie, ou en groupe : des accompagnements
  adaptés à votre binôme, pour mieux comprendre et mieux agir.

liste:
  - titre: Bilan comportemental
    icone: loupe
    resume: >-
      Le point de départ de tout accompagnement : une prestation indépendante,
      réalisée avant l'engagement dans un forfait, pour comprendre votre chien
      et construire un plan sur mesure.
    pour_qui: Tous les chiens et leurs familles
    etapes:
      - Échange sur votre quotidien et vos attentes
      - Observation de votre chien dans son environnement
      - Proposition d'un forfait adapté, avec une date de fin fixée dès le départ
    photo:
    description_photo: Marion qui observe un chien avec sa famille, à domicile

  - titre: Éducation à domicile
    icone: maison
    resume: >-
      Un accompagnement chez vous, au rythme d'une séance par semaine, pour
      apprendre dans le respect de votre chien et à son rythme.
    pour_qui: Chiots et chiens adultes
    etapes:
      - 1 séance théorique, puis de 5 à 20 séances pratiques d'1 heure
      - 1 séance par semaine, avec une date de fin fixée dès le départ
      - Des exercices concrets à refaire entre les séances
    photo:
    description_photo: Séance d'éducation dans un jardin ou un salon

  - titre: Comportementalisme
    icone: poignee-de-main
    resume: >-
      Peurs, réactivité, aboiements, destructions : mieux comprendre l'origine
      du comportement pour accompagner le changement avec cohérence.
    pour_qui: Chiens anxieux, réactifs ou en difficulté
    etapes:
      - Analyse du comportement et de son contexte
      - Plan d'accompagnement personnalisé
      - Suivi régulier jusqu'à la date de fin, fixée dès le départ
    photo:
    description_photo: Moment calme et complice avec un chien

  - titre: Cours collectifs
    icone: groupe
    resume: >-
      Des cours en groupe pour travailler la sociabilité et les apprentissages
      dans un cadre stimulant. Cours d'1 heure à 25 €, et 10 cours payés = le
      11e offert !
    pour_qui: "[[Chiens concernés, ex. : à partir de X mois]]"
    etapes:
      - "[[Lieu et jour des cours]]"
      - Cours d'1 heure, 25 € le cours
      - 10 cours payés = le 11e offert
    photo: cours-collectif-1.jpg
    description_photo: Cours collectif en extérieur
