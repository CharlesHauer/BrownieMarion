# ============================================================
#  PAGE TARIFS
# ============================================================
#  - Chaque forfait commence par « - nom: »
#  - mise_en_avant: oui  → carte foncée avec une étiquette
#    (texte de l'étiquette : champ « etiquette »)
#  - [[ ... ]] = texte à compléter
#  - Tarifs issus de la grille tarifaire (prix en euros TTC)

surtitre: Tarifs
titre: Des formules claires et adaptées
intro: >-
  Un accompagnement adapté aux besoins de chaque chien. Les séances
  individuelles durent 1 heure et sont organisées à raison d'une séance par
  semaine, avec une date de fin fixée dès le départ.

# --- Bilan comportemental (encart avant les forfaits) ---------
bilan:
  titre: Bilan comportemental préalable
  prix: 40 €
  texte: Prestation indépendante, réalisée avant l'engagement dans un forfait.

# --- Accompagnement individuel --------------------------------
forfaits_titre: Accompagnement individuel

formules:
  - nom: 5 séances pratiques
    prix: 300 €
    description: 1 séance théorique + 5 séances pratiques
    inclus:
      - Séances d'1 heure, 1 par semaine, à domicile
      - Date de fin fixée dès le départ
      - Paiement en 1 fois ou 2 fois sans frais
    mise_en_avant: non

  - nom: 10 séances pratiques
    prix: 550 €
    description: 1 séance théorique + 10 séances pratiques
    inclus:
      - Séances d'1 heure, 1 par semaine, à domicile
      - Date de fin fixée dès le départ
      - Paiement en 1 fois ou 2 fois sans frais
    mise_en_avant: oui
    etiquette: "[[Le plus choisi]]"

  - nom: 15 séances pratiques
    prix: 800 €
    description: 1 séance théorique + 15 séances pratiques
    inclus:
      - Séances d'1 heure, 1 par semaine, à domicile
      - Date de fin fixée dès le départ
      - Paiement en 1 fois ou jusqu'à 4 fois sans frais
    mise_en_avant: non

  - nom: 20 séances pratiques
    prix: 1 050 €
    description: 1 séance théorique + 20 séances pratiques
    inclus:
      - Séances d'1 heure, 1 par semaine, à domicile
      - Date de fin fixée dès le départ
      - Paiement en 1 fois ou jusqu'à 4 fois sans frais
    mise_en_avant: non

# --- Cours collectifs (bandeau orange sous les forfaits) ------
# Supprimez ce bloc pour le masquer.
cours_collectifs:
  titre: Cours collectif (1 heure)
  prix: 25 €
  texte: 10 cours payés = le 11e offert !

# --- Infos pratiques ------------------------------------------
infos_pratiques:
  surtitre: Infos pratiques
  titre: Bon à savoir
  liste:
    - icone: calendrier
      titre: Rythme
      texte: >-
        Séances individuelles d'1 heure, à raison d'une séance par semaine,
        avec une date de fin fixée dès le départ.
    - icone: lieu
      titre: Déplacements
      texte: >-
        À domicile sur Nantes et sa périphérie, dans un rayon de 30 km autour du
        Leclerc Paridis.
    - icone: carte-bancaire
      titre: Paiement
      texte: >-
        Par chèque ou virement bancaire. En 1 fois, 2 fois ou jusqu'à 4 fois
        sans frais selon le forfait. Prix en euros TTC.

# --- Questions fréquentes -------------------------------------
faq:
  surtitre: FAQ
  titre: Questions fréquentes
  questions:
    - question: Comment réserver ?
      reponse: >-
        Appelez-moi au 07 59 75 10 59, ou utilisez le formulaire de contact pour
        réserver votre bilan comportemental.
    - question: Pourquoi commencer par un bilan comportemental ?
      reponse: >-
        Le bilan (40 €) est une prestation indépendante, réalisée avant tout
        engagement. Il permet de comprendre votre chien et de choisir ensemble
        le forfait le plus adapté.
    - question: Combien de séances faut-il prévoir ?
      reponse: >-
        Chaque forfait comprend 1 séance théorique et de 5 à 20 séances
        pratiques d'1 heure, à raison d'une séance par semaine. Le bilan
        comportemental permet de choisir le forfait adapté.
    - question: Pourquoi une date de fin fixée dès le départ ?
      reponse: >-
        Parce que l'objectif est votre autonomie. Une date de fin donne un cap
        clair et des objectifs concrets : à la fin de l'accompagnement, vous
        avez les clés pour continuer seul·e avec votre chien.
    - question: Comment se passe le paiement ?
      reponse: >-
        Par chèque ou virement bancaire, en 1 fois ou 2 fois sans frais pour les
        forfaits de 5 et 10 séances, et jusqu'à 4 fois sans frais pour les
        forfaits de 15 et 20 séances.
    - question: Où se déroulent les séances ?
      reponse: >-
        À votre domicile, sur Nantes et sa périphérie (dans un rayon de 30 km
        autour du Leclerc Paridis). Les cours collectifs ont lieu [[lieu]].
    - question: Qu'est-ce qu'une méthode semi-positive ?
      reponse: >-
        Des outils bienveillants, adaptés à chaque chien et à chaque situation,
        pour une relation durable. [[Précisez votre approche en quelques mots.]]
    - question: Toute la famille peut-elle participer ?
      reponse: >-
        Oui, c'est même recommandé : l'éducation fonctionne mieux quand tout le
        monde applique les mêmes règles.
