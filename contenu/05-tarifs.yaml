# ============================================================
#  PAGE TARIFS
# ============================================================
#  - Chaque formule commence par « - nom: »
#  - mise_en_avant: oui  → carte foncée avec « Le plus choisi »
#    (une seule formule de préférence)
#  - [[ ... ]] = texte à compléter

surtitre: Tarifs
titre: Des formules claires et adaptées
intro: >-
  Chaque accompagnement commence par une séance découverte pour faire le point
  ensemble.

formules:
  - nom: Séance découverte
    prix: "[[XX]] €"
    detail_prix: 1h30
    description: Le point de départ pour faire connaissance et poser un bilan.
    inclus:
      - Bilan complet du chien
      - Échange sur vos objectifs
      - Premiers conseils concrets
      - Plan d'accompagnement proposé
    mise_en_avant: non

  - nom: Séance individuelle
    prix: "[[XX]] €"
    detail_prix: la séance d'1h
    description: Une séance ciblée, à domicile ou en extérieur.
    inclus:
      - Travail sur un objectif précis
      - Exercices adaptés à votre quotidien
      - Compte-rendu écrit
    mise_en_avant: non

  - nom: Forfait 5 séances
    prix: "[[XXX]] €"
    detail_prix: au lieu de [[XXX]] €
    description: Le meilleur rapport pour progresser durablement.
    inclus:
      - 5 séances d'1h
      - Suivi par message entre les séances
      - Compte-rendu après chaque séance
      - Valable [[X]] mois
    mise_en_avant: oui

  - nom: Pack chiot
    prix: "[[XXX]] €"
    detail_prix: 4 séances
    description: Tout pour bien démarrer avec votre nouveau compagnon.
    inclus:
      - Propreté et routines
      - Socialisation
      - Rappel et marche en laisse
      - Livret d'accueil du chiot
    mise_en_avant: non

# --- Infos pratiques ------------------------------------------
infos_pratiques:
  surtitre: Infos pratiques
  titre: Bon à savoir
  liste:
    - icone: lieu
      titre: Déplacements
      texte: >-
        Inclus dans un rayon de [[XX]] km autour de [[Ville]]. Au-delà : [[X]]
        €/km.
    - icone: carte-bancaire
      titre: Paiement
      texte: >-
        Espèces, virement ou [[autre moyen]]. Paiement en [[X]] fois possible
        pour les forfaits.
    - icone: annulation
      titre: Annulation
      texte: Gratuite jusqu'à [[48h]] avant la séance. Au-delà, la séance est due.

# --- Questions fréquentes -------------------------------------
faq:
  surtitre: FAQ
  titre: Questions fréquentes
  questions:
    - question: À partir de quel âge peut-on commencer l'éducation ?
      reponse: >-
        Dès l'arrivée du chiot à la maison, généralement vers 2 mois. Il n'est
        jamais trop tard : un chien adulte ou senior peut aussi apprendre.
    - question: Où se déroulent les séances ?
      reponse: >-
        À votre domicile, ou à l'extérieur selon l'objectif (parc, ville,
        forêt). Le lieu est choisi ensemble pour être au plus près de votre
        quotidien.
    - question: Quelles méthodes utilisez-vous ?
      reponse: >-
        Uniquement des méthodes positives et respectueuses, sans coercition ni
        matériel punitif (collier étrangleur, électrique…).
    - question: Combien de séances faut-il prévoir ?
      reponse: >-
        Cela dépend de votre chien et de vos objectifs. Le bilan de la séance
        découverte permet d'estimer le nombre de séances. En moyenne : [[X à Y]]
        séances.
    - question: Toute la famille peut-elle participer ?
      reponse: >-
        Oui, c'est même recommandé ! Les enfants sont les bienvenus :
        l'éducation fonctionne mieux quand tout le monde applique les mêmes
        règles.
