# ============================================================
#  PAGE À PROPOS (et présentation sur la page Accueil)
# ============================================================
#  - [[ ... ]] = texte à compléter
#  - Photos : nom du fichier déposé dans public/images

# --- Présentation (aussi affichée sur l'Accueil) --------------
titre: Bonjour, moi c'est Marion !
presentation: >-
  Éducatrice et comportementaliste canin, j'interviens à domicile sur Nantes et
  sa périphérie. Mon objectif : vous donner les clés pour une autonomie durable
  avec votre chien, dans le respect de son rythme. [[Une phrase sur ce qui vous
  a amenée à ce métier.]]
photo_portrait:

# Les 3 chiffres clés (aussi affichés sur l'Accueil)
chiffres:
  - chiffre: "[[X]] ans"
    texte: d'expérience
  - chiffre: 1 séance
    texte: par semaine
  - chiffre: 30 km
    texte: autour de Nantes

# --- Mon parcours ---------------------------------------------
parcours:
  surtitre: Mon histoire
  titre: Mon parcours
  # Un tiret = un paragraphe. Vous pouvez en ajouter ou en retirer.
  paragraphes:
    - "[[Votre parcours : comment est née votre passion pour les chiens, vos expériences marquantes.]]"
    - "[[Votre formation : où et comment vous vous êtes formée en éducation et en comportementalisme.]]"
    - "[[Votre chien : présentez-le, et son rôle dans votre parcours ou vos séances.]]"

formations:
  titre: Formations & certifications
  liste:
    - "[[Diplôme / certificat d'éducateur canin]]"
    - "[[Formation en comportementalisme canin]]"
    - "[[ACACED — Attestation de connaissances]]"

# --- Ma méthode -----------------------------------------------
methode:
  surtitre: Ma méthode
  titre: Comprendre pour restaurer le lien

# Les valeurs (aussi affichées sur l'Accueil)
# Icônes possibles : voir la liste dans 00-LISEZ-MOI.md
valeurs:
  - icone: diplome
    titre: Éducation
    texte: Apprendre dans le respect de votre chien et à son rythme.
  - icone: patte
    titre: Compréhension
    texte: Mieux comprendre pour mieux agir.
  - icone: maison
    titre: Accompagnement personnalisé
    texte: À domicile, pour des situations adaptées à votre binôme.
  - icone: coeur
    titre: Méthode semi-positive
    texte: Des outils bienveillants pour une relation durable.

# --- Photos en bas de page ------------------------------------
photos:
  - photo:
    description: Séance à domicile
  - photo:
    description: Marion et son chien
  - photo:
    description: Cours collectif

# --- Bandeau de fin de page -----------------------------------
bandeau_titre: Envie qu'on fasse connaissance ?
