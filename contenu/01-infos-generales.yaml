# --- Identité -------------------------------------------------
nom: Marion
metier: Éducatrice canine
nom_du_site: Marion Éducation Canine
slogan: Éducation canine bienveillante

# Texte affiché par Google sous le nom du site (150 caractères environ)
description_google: >-
  Éducation canine bienveillante : chiots, cours individuels, marche en laisse,
  comportement. Des méthodes positives pour une relation de confiance avec
  votre chien.

# --- Coordonnées ----------------------------------------------
email: contact@example.com
telephone: 06 00 00 00 00
zone: "[[Ville]] et alentours ([[XX]] km)"
horaires: "[[Du lundi au samedi, 9h – 19h]]"

# --- Réseaux sociaux ------------------------------------------
# Collez l'adresse complète de la page. Laissez vide pour masquer le réseau.
reseaux:
  instagram: https://instagram.com/
  facebook: https://facebook.com/
  tiktok: https://tiktok.com/

# --- Bouton principal -----------------------------------------
# Le même texte est utilisé sur tous les boutons d'action du site.
