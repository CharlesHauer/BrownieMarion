# ============================================================
#  PAGE ACCUEIL
# ============================================================
#  - Mettez un ou plusieurs mots entre *étoiles* pour les mettre
#    en valeur (écriture manuscrite orange), dans les titres
#    « haut_de_page » et « approche ».
#  - Photos : déposez le fichier dans le dossier public/images
#    puis écrivez son nom, ex : photo: marion-brownie.jpg
#    Laissez vide pour afficher la zone « Photo à insérer ».
#  - Le texte « Bonjour, moi c'est Marion » et les chiffres
#    se modifient dans 03-a-propos.yaml (ils sont partagés).

# --- Haut de page ---------------------------------------------
haut_de_page:
  surtitre: Éducation & comportementalisme canin
  titre: Éduquer avec *bienveillance,* accompagner avec *cohérence*
  texte: >-
    Je vous accompagne à domicile, sur Nantes et sa périphérie, pour vous
    donner les clés d'une relation sereine et durable avec votre chien.
  # Image à droite du titre (le logo par défaut)
  image: logo.png
  points_forts:
    - icone: coeur
      texte: Méthode semi-positive
    - icone: maison
      texte: À domicile
    - icone: lieu
      texte: Nantes et périphérie
  # Petite carte blanche posée sur l'image (supprimez ces 3 lignes
  # pour la masquer)
  badge:
    chiffre: De 5 à 20 séances
    texte: selon le forfait choisi

# --- Le déroulement (parcours en étapes jusqu'à la date de fin) ---
# Chaque étape commence par « - icone: ». La dernière s'affiche
# comme la ligne d'arrivée (drapeau).
approche:
  titre: Vous donner les clés pour une *autonomie durable* avec votre chien.
  texte: >-
    Chaque accompagnement a un début... et une fin. Une date de fin fixée dès le
    départ, c'est un cap clair, des objectifs concrets et des progrès que vous
    constatez séance après séance.
  etapes:
    - icone: loupe
      titre: Bilan comportemental
      texte: On fait le point ensemble et on choisit le forfait adapté.
    - icone: diplome
      titre: Séance théorique
      texte: Comprendre votre chien, ses besoins et son langage.
    - icone: calendrier
      titre: Séances pratiques
      texte: De 5 à 20 séances d'1 heure, à raison d'une par semaine.
    - icone: drapeau
      titre: Date de fin
      texte: Fixée dès le départ. Vous repartez autonome, avec les clés pour continuer.
  conclusion: >-
    Mon objectif : qu'à la fin de l'accompagnement, vous n'ayez plus besoin de
    moi.

# --- Présentation de Marion -----------------------------------
presentation:
  surtitre: Qui suis-je ?
  photo_1: marion-et-son-chien.jpg
  # photo_2 : uniquement une photo de Marion ou sans personne (pas de client)
  photo_2: terrain-agility-2.jpg
  bouton: Mon parcours

# --- Sections suivantes ---------------------------------------
