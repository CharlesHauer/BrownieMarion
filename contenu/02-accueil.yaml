# ============================================================
#  PAGE ACCUEIL
# ============================================================
#  - Mettez un mot entre *étoiles* pour le mettre en valeur
#    (couleur + soulignement), uniquement dans le grand titre.
#  - Photos : déposez le fichier dans le dossier public/images
#    puis écrivez son nom, ex : photo: marion-brownie.jpg
#    Laissez vide pour afficher la zone « Photo à insérer ».
#  - Le texte « Bonjour, moi c'est Marion » et les chiffres
#    se modifient dans 03-a-propos.yaml (ils sont partagés).

# --- Haut de page ---------------------------------------------
haut_de_page:
  surtitre: Éducatrice canine
  titre: Une relation de *confiance* avec votre chien
  texte: >-
    Des méthodes positives et bienveillantes pour accompagner votre chien à
    chaque étape de sa vie, à domicile ou en extérieur.
  photo:
  points_forts:
    - icone: poignee-de-main
      texte: Méthodes positives
    - icone: maison
      texte: À domicile
    - icone: pousse
      texte: Chiots & adultes
  # Petite carte blanche posée sur la photo
  badge:
    chiffre: "[[XXX]] chiens"
    texte: accompagnés avec succès

# --- Présentation de Marion -----------------------------------
presentation:
  surtitre: Qui suis-je ?
  photo_1:
  photo_2:
  bouton: Mon parcours

# --- Sections suivantes ---------------------------------------
