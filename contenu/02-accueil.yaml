# ============================================================
#  PAGE ACCUEIL
# ============================================================
#  - Mettez un ou plusieurs mots entre *étoiles* pour les mettre
#    en valeur (écriture manuscrite orange), dans les titres
#    « haut_de_page » et « approche ».
#  - Photos : déposez le fichier dans le dossier public/images
#    puis écrivez son nom, ex : photo: marion-brownie.jpg
#    Laissez vide pour afficher la zone « Photo à insérer ».
#  - Le texte « Bonjour, moi c'est Marion » et les chiffres
#    se modifient dans 03-a-propos.yaml (ils sont partagés).

# --- Haut de page ---------------------------------------------
haut_de_page:
  surtitre: Éducation & comportementalisme canin
  titre: Éduquer avec *bienveillance,* accompagner avec *cohérence*
  texte: >-
    Je vous accompagne à domicile, sur Nantes et sa périphérie, pour vous
    donner les clés d'une relation sereine et durable avec votre chien.
  # Image à droite du titre (le logo par défaut)
  image: logo.png
  points_forts:
    - icone: coeur
      texte: Méthode semi-positive
    - icone: maison
      texte: À domicile
    - icone: lieu
      texte: Nantes et périphérie
  # Petite carte blanche posée sur l'image (supprimez ces 3 lignes
  # pour la masquer)
  badge:
    chiffre: De 5 à 20 séances
    texte: selon le forfait choisi

# --- Mon approche (bandeau sous le haut de page) --------------
approche:
  titre: Vous donner les clés pour une *autonomie durable* avec votre chien.
  points:
    - icone: calendrier
      titre: 1 séance
      texte: par semaine
    - icone: patte
      titre: De 5 à 20 séances
      texte: selon le forfait choisi
    - icone: drapeau
      titre: Une date de fin
      texte: fixée dès le départ

# --- Présentation de Marion -----------------------------------
presentation:
  surtitre: Qui suis-je ?
  photo_1:
  photo_2:
  bouton: Mon parcours

# --- Sections suivantes ---------------------------------------
